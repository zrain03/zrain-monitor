# BM: Konfigurasi automasi pemeriksaan kod dan operasi.
# EN: Automation configuration for code checks and operations.
name: Monitor checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run ui:sync
      - run: npm run test:release
# GitHub Actions runs tests only, not the 24/7 monitoring scheduler.
